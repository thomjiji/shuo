name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: dotnet run --project test/TextCleanup.Tests/TextCleanup.Tests.csproj --configuration Release
      - name: Publish portable EXE
        shell: pwsh
        run: |
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          dotnet publish src/Shuo/Shuo.csproj --configuration Release --runtime win-x64 --output publish\win-x64 -p:PortableBundle=true "-p:NodeRuntimePath=$node"
      - name: Upload GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "publish\win-x64\shuo.exe"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset --clobber
          } else {
            gh release create $env:RELEASE_TAG $asset --generate-notes --title "shuo $env:RELEASE_TAG"
          }
