name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: dotnet run --project test/TextCleanup.Tests/TextCleanup.Tests.csproj --configuration Release
      - name: Build installer and update feed
        shell: pwsh
        run: |
          $releaseVersion = $env:RELEASE_TAG -replace '^v', ''
          node scripts/package.mjs $releaseVersion artifacts/installer
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }
      - name: Verify update feed
        shell: pwsh
        run: |
          $releaseVersion = $env:RELEASE_TAG -replace '^v', ''
          dotnet run --project test/Update.Tests/Update.Tests.csproj --configuration Release -- artifacts/installer/releases $releaseVersion ShuoDesktop
          if ($LASTEXITCODE -ne 0) { throw "Update feed verification failed" }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts/installer/releases -File | Where-Object { $_.Extension -ne '.zip' -and $_.Name -ne 'assets.win.json' } | ForEach-Object FullName
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --generate-notes --title "shuo $env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
