[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "shuo-tts"
version = "0.1.0"
description = "Private MLX text-to-speech service for Shuo on Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "soundfile>=0.12,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
cosyvoice = [
    "mlx-audio-plus==0.1.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
qwen3 = [
    "mlx-audio==0.5.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
conflicts = [
    [
        { extra = "cosyvoice" },
        { extra = "qwen3" },
    ],
]

[project.scripts]
shuo-tts = "shuo_tts.server:main"
shuo-tts-voice = "shuo_tts.profiles:main"

[tool.setuptools.packages.find]
include = ["shuo_tts*"]
