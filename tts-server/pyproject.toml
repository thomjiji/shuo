[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "shuo-tts"
version = "0.1.0"
description = "Private CosyVoice 3 reading service for Shuo on Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "soundfile>=0.12,<1",
    "uvicorn>=0.30,<1",
    "mlx-audio-plus==0.1.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
shuo-tts = "shuo_tts.server:main"
shuo-tts-voice = "shuo_tts.profiles:main"

[tool.setuptools.packages.find]
include = ["shuo_tts*"]
